project:
  type: book
  output-dir: _book
  # Removes Quarto's duplicate <link> ids (WCAG 4.1.1 checker findings)
  post-render: tools/fix-duplicate-ids.py

book:
  title: "Argument Mapping"
  author: "Dona Warren"
  page-footer:
    center: "© 2026 Dona Warren · [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"
  search: true
  downloads: [docx]
  site-url: "https://donawarren-netizen.github.io/argument-mapping-book/"
  chapters:
    - index.qmd
    - part: "Chapter 5: Missing Conclusions"
      chapters:
        - chapters/ch05/05-01-introduction.qmd

lang: en
license: "CC BY-NC-SA"

# Sections are numbered by hand in their titles (if at all), and figures
# are numbered within each section page: Figure 1, 2, 3 ...
number-sections: false
crossref:
  chapters: false

filters:
  - path: filters/map-outline.lua
    at: pre-quarto
  - path: filters/docx-figure-numbers.lua
    at: post-quarto
  - path: filters/docx-alt-text.lua
    at: post-quarto

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    include-after-body: search-label.html
    lightbox: true
    fig-align: center
  docx:
    toc: true
    toc-depth: 1
    fig-align: center
